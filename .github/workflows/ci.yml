name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # exact pin: dotnet-fsharplint crashed (exit 255, its unhandled-
          # exception path) on a runner-picked newer SDK that no local
          # environment could reproduce; 10.0.302 is validated on Windows,
          # WSL and an isolated Linux install
          dotnet-version: 10.0.302

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet fantomas --check src tests

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # fsharplint evaluates projects through Ionide.ProjInfo, which loads
      # MSBuild assemblies FROM THE SDK — those want System.Runtime
      # 10.0.0.0, while the tool itself targets net8 and binds to a net8
      # runtime when one is present (exact match beats roll-forward). The
      # mismatch is the exit-255 crash. DOTNET_ROLL_FORWARD does NOT fix
      # it — verified locally against the same failure in
      # fsharp-analyzers, where only the host flag worked — so the tool is
      # launched through `dotnet exec --roll-forward LatestMajor`.
      - name: Lint
        shell: bash
        run: |
          LINT=$(find ~/.nuget/packages/dotnet-fsharplint -name dotnet-fsharplint.dll | sort | tail -1)
          echo "linting with $LINT"
          for p in src/FSharp.Refactor.Analyzers/FSharp.Refactor.Analyzers.fsproj \
                   src/FSharp.Refactor.Tool/FSharp.Refactor.Tool.fsproj \
                   tests/FSharp.Refactor.Tests/FSharp.Refactor.Tests.fsproj; do
            dotnet exec --roll-forward LatestMajor "$LINT" lint "$p"
          done

      # both shipped projects, not just the analyzers: the apply tool is F#
      # we ship too, and it went a long time unchecked
      # Launched exactly like the linter above, and for the same reason: the
      # CLI reaches MSBuild through Ionide.ProjInfo, those assemblies want
      # System.Runtime 10.0.0.0, and the tool ships as net8 so it binds a net8
      # runtime whenever one is installed - an exact match beats roll-forward.
      # `"rollForward": true` in dotnet-tools.json does NOT reach this; only
      # the host flag does.
      - name: Self-analyze (dogfood)
        shell: bash
        run: |
          CLI=$(find ~/.nuget/packages/fsharp-analyzers -name FSharp.Analyzers.Cli.dll | sort | tail -1)
          echo "analyzing with $CLI"
          dotnet exec --roll-forward LatestMajor "$CLI" --project src/FSharp.Refactor.Analyzers/FSharp.Refactor.Analyzers.fsproj --analyzers-path src/FSharp.Refactor.Analyzers/bin/Release/net8.0 --code-root . --report self-analysis.sarif
          dotnet exec --roll-forward LatestMajor "$CLI" --project src/FSharp.Refactor.Tool/FSharp.Refactor.Tool.fsproj --analyzers-path src/FSharp.Refactor.Analyzers/bin/Release/net8.0 --code-root . --report self-analysis-apply.sarif

      - name: Pack
        run: |
          dotnet pack src/FSharp.Refactor.Analyzers -c Release -o artifacts
          dotnet pack src/FSharp.Refactor.Tool -c Release -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # exact pin: dotnet-fsharplint crashed (exit 255, its unhandled-
          # exception path) on a runner-picked newer SDK that no local
          # environment could reproduce; 10.0.302 is validated on Windows,
          # WSL and an isolated Linux install
          dotnet-version: 10.0.302

      - name: Pack
        run: |
          dotnet pack src/FSharp.Refactor.Analyzers -c Release -o artifacts
          dotnet pack src/FSharp.Refactor.Tool -c Release -o artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # the classic Visual Studio extension: net48/WPF, so Windows-only —
  # deliberately outside FSharp.Refactor.slnx (the build job is Linux)
  vsix:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Build VSIX
        run: powershell -NoProfile -File src/FSharp.Refactor.Vsix/CreateVsix.ps1

      - name: Validate package opens as OPC
        shell: pwsh
        run: |
          Add-Type -AssemblyName WindowsBase
          $p = [System.IO.Packaging.Package]::Open('src/FSharp.Refactor.Vsix/artifacts/FSharp.Refactor.vsix', 'Open', 'Read')
          $p.GetParts() | ForEach-Object { $_.Uri.ToString() }
          $p.Close()

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: src/FSharp.Refactor.Vsix/artifacts/FSharp.Refactor.vsix

      # Marketplace publish on version tags, once the VS_MARKETPLACE_PAT
      # secret exists (an Azure DevOps PAT with Marketplace -> Manage
      # scope for the publisher in publishManifest.json)
      - name: Publish to VS Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if (-not $env:PAT) { Write-Host 'VS_MARKETPLACE_PAT not set; skipping marketplace publish'; exit 0 }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $vsixPublisher = Join-Path $vsPath 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe'
          & $vsixPublisher publish -payload src/FSharp.Refactor.Vsix/artifacts/FSharp.Refactor.vsix -publishManifest src/FSharp.Refactor.Vsix/publishManifest.json -personalAccessToken $env:PAT

  # the VS Code companion extension: bundles both analyzer SDK builds and
  # wires Ionide's FSharp.analyzersPath (with consent) on activation
  vscode-ext:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build VS Code extension
        shell: pwsh
        run: pwsh -File src/FSharp.Refactor.VsCode/CreateVsCodeVsix.ps1

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: src/FSharp.Refactor.VsCode/artifacts/*.vsix

      # Marketplace publish on version tags, once the VSCE_PAT secret
      # exists (an Azure DevOps PAT with Marketplace -> Manage scope for
      # the VS Code publisher in package.json)
      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: src/FSharp.Refactor.VsCode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if (-not $env:VSCE_PAT) { Write-Host 'VSCE_PAT not set; skipping marketplace publish'; exit 0 }
          npx vsce publish --packagePath (Get-ChildItem artifacts/*.vsix | Select-Object -First 1 -ExpandProperty FullName)
